[project]
name = "story-book-generator"
version = "0.1.0"
description = "Premade characters -> story prompt -> fixed-layout EPUB children's book generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Photo preprocessing (person extraction) for character source photos.
    "rembg[cpu]>=2.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# Local orchestrator for running the pipeline in a Google Antigravity managed
# environment (install with `uv sync --extra antigravity`).
antigravity = ["google-genai>=2.3.0"]

[tool.uv]
# This is a collection of scripts, not an installable package; manage deps only.
package = false
# rembg -> pymatting -> numba; the default resolution picks a numba too old for
# Python 3.12, so force versions with 3.12 wheels.
override-dependencies = ["numba>=0.60.0", "llvmlite>=0.43.0"]
